# Logging enable karein taaki forwarding visually dikhe
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.servlet.function=DEBUG

# Disable HTTP/2 cleartext upgrade to downstream services
spring.cloud.gateway.mvc.http-client.version=HTTP_1_1
spring.cloud.gateway.httpclient.wiretap=false